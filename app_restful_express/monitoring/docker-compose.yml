# Monitoreo del microservicio: Prometheus recolecta /metrics y Grafana lo grafica.
#   docker compose -f monitoring/docker-compose.yml up -d
# Prometheus: http://localhost:9090  |  Grafana: http://localhost:3001 (admin / admin)
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lsw-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:11.3.0
    container_name: lsw-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
