# Regresión de Quant Core F0: quant-core-engine/pruebas (unitarias, integración, contrato) + pruebas del motor Rust.
name: Quant Core F0 CI

on:
  push:
    paths: ['quant-core-engine/**', '.github/workflows/quant-ci.yml']
  pull_request:
    paths: ['quant-core-engine/**']

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: quant-core-engine/api
      - run: npm test
        working-directory: quant-core-engine/pruebas
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quant-core-engine/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
