# Publica el front de Quant Core F0 (quant-core-engine/web) en GitHub Pages en cada push a main.
name: Front F0 en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['quant-core-engine/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quant-core-engine/web
      - id: deployment
        uses: actions/deploy-pages@v4
